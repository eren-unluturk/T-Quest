services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tquest
    ports:
      - "5432:5432"
    volumes:
      - tquest_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tquest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tquest_db:
