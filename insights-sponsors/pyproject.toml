[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insights-sponsors"
version = "0.1.0"
description = "T-Quest insights, sponsors, catalog and consent service"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "psycopg[binary]>=3",
  "psycopg-pool>=3.2",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "openapi-spec-validator", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["db: needs a Tiger Data / TimescaleDB database (DATABASE_URL); skipped otherwise"]
