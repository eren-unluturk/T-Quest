openapi: 3.0.3
info:
  title: T-Quest insights-sponsors API
  version: 0.1.1
  x-changelog:
    - '0.1.1: document 409 on POST /consent and ConsentRequired'
    - '0.1.0: first draft'
  description: |
    Tourist content, sponsor offers, store partners, the physical-reward catalog,
    route analytics, recommendations and consent. Owner: insights-sponsors (Eren).
    DRAFT. Lives in insights-sponsors/openapi/ until promoted to contracts/api/insights-sponsors.yaml.
    Auth: bearer token on every route except GET /fun-facts (loading screen).
    The user id comes from the session. Non-MBTA location use requires consent (403 otherwise).
    game-engine owns redemption issuing (POST /redemptions) and store verification
    (POST /redemptions/verify). This service owns the catalog those routes reference by offer_id.
    Rank and discount numbers come from game-engine.yaml x-rules.ranks.
    Sponsor placements are native (local picks, sponsored quests), never pop-ups.
servers:
  - url: http://localhost:8002
security:
  - bearerAuth: []
paths:
  /stops/{stop_id}/facts:
    get:
      summary: Fast facts, history and Freedom Trail notes for a stop
      parameters:
        - {$ref: '#/components/parameters/StopId'}
      responses:
        '200':
          description: Facts for the stop
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StopFacts'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Unknown stop}
  /stops/{stop_id}/local-picks:
    get:
      summary: Native sponsor placements near a stop
      description: Local picks are native placements shown inside the stop view, never pop-ups.
      parameters:
        - {$ref: '#/components/parameters/StopId'}
        - name: limit
          in: query
          schema: {type: integer, default: 5, minimum: 1, maximum: 20}
      responses:
        '200':
          description: Nearby partner stores with their offers
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LocalPick'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {description: Unknown stop}
  /freedom-trail:
    get:
      summary: Freedom Trail sites in walking order
      responses:
        '200':
          description: Trail sites
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TrailSite'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /fun-facts:
    get:
      summary: Loading-screen fun facts
      security: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, default: 10, minimum: 1, maximum: 50}
        - name: random
          in: query
          schema: {type: boolean, default: true}
      responses:
        '200':
          description: Fun facts
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FunFact'}
  /offers:
    get:
      summary: Sponsor offers
      parameters:
        - name: stop_id
          in: query
          schema: {type: string}
        - name: store_id
          in: query
          schema: {type: string}
        - name: category
          in: query
          schema: {type: string, enum: [food, clothing, sports, other]}
        - name: eligible_only
          in: query
          description: When true, only offers the caller's rank and badges qualify for.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Offers
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Offer'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /physical-rewards/catalog:
    get:
      summary: Sticker and patch catalog
      description: Each physical reward maps to a badge. Redemption is issued and verified by game-engine.
      responses:
        '200':
          description: Catalog entries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PhysicalReward'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /recommendations:
    get:
      summary: Route, neighborhood and stop recommendations
      description: |
        SQL-based over Tiger Data aggregates. Place-visit signals are used only
        when the place_visits consent is granted. This route never returns 403:
        without that consent the place-visit signals are silently skipped.
      parameters:
        - name: kind
          in: query
          schema: {type: string, enum: [route, neighborhood, stop]}
        - name: limit
          in: query
          schema: {type: integer, default: 5, minimum: 1, maximum: 50}
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Recommendations'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /analytics/me:
    get:
      summary: The caller's route analytics
      parameters:
        - name: period
          in: query
          schema: {type: string, enum: [week, month, all], default: month}
      responses:
        '200':
          description: Analytics for the period
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MyAnalytics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /consent:
    get:
      summary: The caller's consent records
      description: |
        Consent state per scope. Routes that gate on a consent return the reusable
        ConsentRequired response (403, detail "consent required: <scope>"). No route
        does that yet; the response is kept in components for future routes.
      responses:
        '200':
          description: One record per scope
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Consent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Grant consent for a scope
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConsentRequest'}
      responses:
        '201':
          description: Consent granted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Consent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: policy_version is not the current policy version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyMismatch'}
        '422': {description: Unknown scope or malformed body}
  /consent/{scope}:
    delete:
      summary: Revoke consent for a scope
      description: |
        Revoking place_visits stops future use and makes stored place-visit data
        ineligible for recommendations.
      parameters:
        - name: scope
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ConsentScope'}
      responses:
        '200':
          description: Consent revoked (granted false)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Consent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    StopId:
      name: stop_id
      in: path
      required: true
      schema: {type: string}
  responses:
    ConsentRequired:
      description: 'Consent required: <scope>. The caller has not granted (or has revoked) the consent this route needs.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Missing or malformed bearer token
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
    PolicyMismatch:
      type: object
      required: [detail, current]
      properties:
        detail: {type: string}
        current: {type: string, description: The current policy version}
    Fact:
      type: object
      required: [id, kind, title, body]
      properties:
        id: {type: string}
        kind: {type: string, enum: [fast_fact, history, freedom_trail]}
        title: {type: string}
        body: {type: string}
        source_url: {type: string, nullable: true}
    StopFacts:
      type: object
      required: [stop_id, stop_name, facts]
      properties:
        stop_id: {type: string}
        stop_name: {type: string}
        facts:
          type: array
          items: {$ref: '#/components/schemas/Fact'}
    StorePartner:
      type: object
      required: [id, name, category, lat, lon, nearest_stop_id, address]
      properties:
        id: {type: string}
        name: {type: string}
        category: {type: string, enum: [food, clothing, sports, other]}
        lat: {type: number}
        lon: {type: number}
        nearest_stop_id: {type: string}
        address: {type: string}
    Offer:
      type: object
      required: [id, sponsor_id, store_id, title, description, kind, min_rank, per_user_limit, starts_at, placement]
      properties:
        id: {type: string}
        sponsor_id: {type: string}
        store_id: {type: string}
        title: {type: string}
        description: {type: string}
        kind: {type: string, enum: [discount, free_item, points_item]}
        discount_pct: {type: integer, nullable: true}
        points_cost: {type: integer, nullable: true}
        min_rank: {type: integer, minimum: 1, maximum: 5}
        required_badge_id: {type: string, nullable: true}
        per_user_limit: {type: integer}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time, nullable: true}
        placement: {type: string, enum: [local_pick, sponsored_quest]}
    LocalPick:
      type: object
      required: [store, offers, distance_m]
      properties:
        store: {$ref: '#/components/schemas/StorePartner'}
        offers:
          type: array
          items: {$ref: '#/components/schemas/Offer'}
        distance_m: {type: number}
    TrailSite:
      type: object
      required: [id, order, name, lat, lon, nearest_stop_id, blurb]
      properties:
        id: {type: string}
        order: {type: integer}
        name: {type: string}
        lat: {type: number}
        lon: {type: number}
        nearest_stop_id: {type: string}
        blurb: {type: string}
    FunFact:
      type: object
      required: [id, body, tags]
      properties:
        id: {type: string}
        body: {type: string}
        tags:
          type: array
          items: {type: string}
    PhysicalReward:
      type: object
      required: [id, kind, name, description, badge_id, min_rank, per_user_limit, stores]
      properties:
        id: {type: string}
        kind: {type: string, enum: [sticker, patch]}
        name: {type: string}
        description: {type: string}
        badge_id: {type: string}
        min_rank: {type: integer, minimum: 1, maximum: 5}
        per_user_limit: {type: integer}
        image_url: {type: string, nullable: true}
        stores:
          type: array
          items:
            type: object
            required: [store_id, in_stock]
            properties:
              store_id: {type: string}
              in_stock: {type: boolean}
    Recommendation:
      type: object
      required: [kind, id, title, reason, score, sponsored]
      properties:
        kind: {type: string, enum: [route, neighborhood, stop]}
        id: {type: string}
        title: {type: string}
        reason: {type: string}
        score: {type: number}
        sponsored: {type: boolean}
        sponsor_id: {type: string, nullable: true}
    Recommendations:
      type: object
      required: [generated_at, items]
      properties:
        generated_at: {type: string, format: date-time}
        items:
          type: array
          items: {$ref: '#/components/schemas/Recommendation'}
    MyAnalytics:
      type: object
      required: [user_id, period, stops_visited, unique_stops, lines_ridden, by_week, top_stops, neighborhoods_explored]
      properties:
        user_id: {type: string}
        period: {type: string, enum: [week, month, all]}
        stops_visited: {type: integer}
        unique_stops: {type: integer}
        lines_ridden:
          type: array
          items: {type: string}
        home_line: {type: string, nullable: true}
        by_week:
          type: array
          items:
            type: object
            required: [week_start, checkins, unique_stops]
            properties:
              week_start: {type: string, format: date}
              checkins: {type: integer}
              unique_stops: {type: integer}
        top_stops:
          type: array
          items:
            type: object
            required: [stop_id, visits]
            properties:
              stop_id: {type: string}
              visits: {type: integer}
        neighborhoods_explored:
          type: array
          items: {type: string}
    ConsentScope:
      type: string
      enum: [location, place_visits]
    Consent:
      type: object
      required: [scope, granted, policy_version]
      properties:
        scope: {$ref: '#/components/schemas/ConsentScope'}
        granted: {type: boolean}
        granted_at: {type: string, format: date-time, nullable: true}
        revoked_at: {type: string, format: date-time, nullable: true}
        policy_version: {type: string}
    ConsentRequest:
      type: object
      required: [scope, policy_version]
      properties:
        scope: {$ref: '#/components/schemas/ConsentScope'}
        policy_version: {type: string}
