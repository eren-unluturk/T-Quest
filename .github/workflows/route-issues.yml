name: route-issues
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const sections = {};
            for (const part of body.split(/^###[ \t]+/m).slice(1)) {
              const lines = part.split(/\r?\n/);
              sections[lines[0].trim()] = lines.slice(1).join('\n').trim();
            }
            const field = (name) => (sections[name] || '').split('\n')[0].trim() || null;
            const from = field('From'), to = field('To'), type = field('Type');
            if (!from || !to || !type) { core.info('Not a message issue; skipping'); return; }
            const wanted = ['to:' + to, 'from:' + from, 'type:' + type];
            if (type === 'blocker') wanted.push('priority:blocker');
            const colors = { to: '1f6feb', from: '8250df', type: 'fbca04', priority: 'd73a4a' };
            for (const name of wanted) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, name, color: colors[name.split(':')[0]] });
              } catch (e) { /* exists */ }
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: wanted });
            if (context.payload.action === 'opened') {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
                body: `[router] Routed: ${from} -> ${to} (${type})${type === 'blocker' ? ', marked priority:blocker' : ''}.` });
            }
