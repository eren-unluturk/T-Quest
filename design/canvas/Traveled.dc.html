<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T-Quest traveled</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Inter:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D3557}a:hover{color:#457B9D}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F3EBDD; font-family: Inter, system-ui, sans-serif; color: #1D3557; overflow: hidden">
  <svg width="390" height="844" viewBox="0 0 390 844" fill="none" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <path d="M300 300L390 240V844H330L310 640L292 540L305 470L300 400Z" fill="#A8DADC"></path>
    <path d="M-10 462L90 440L150 420L196 372L236 322" stroke="#A8DADC" stroke-width="34" stroke-linecap="round"></path>
    <g fill="#B8D9A8"><path d="M140 448L186 440L196 470L150 478Z"></path><circle cx="40" cy="560" r="20"></circle><circle cx="110" cy="230" r="18"></circle><circle cx="120" cy="700" r="26"></circle></g>
    <g stroke="#FFFFFF" stroke-width="3" opacity="0.9">
      <path d="M0 300H300M0 600H300M60 160V844M260 160V300M0 700H320M200 520V844M0 380H120"></path>
    </g>
    <text x="40" y="452" font-family="Caveat, cursive" font-size="17" font-weight="700" fill="#457B9D" transform="rotate(-10 40 452)">Charles River</text>
    <text x="320" y="600" font-family="Caveat, cursive" font-size="18" font-weight="700" fill="#457B9D" transform="rotate(-80 320 600)">Boston Harbor</text>

    <g stroke-linecap="round" stroke-linejoin="round" stroke-width="7" stroke-dasharray="1 12">
      <path d="M55 190L105 260" stroke="#DA291C"></path>
      <path d="M228 470L262 505L252 570L244 620L244 670L210 760M244 670L290 760" stroke="#DA291C"></path>
      <path d="M185 200L198 300L220 355L214 410" stroke="#00843D"></path>
      <path d="M48 508L0 540M48 508L0 590M48 508L20 650M120 488L110 560L90 660" stroke="#00843D"></path>
      <path d="M255 170L240 260L220 355L232 390L242 432L228 470L220 500L160 545L140 620L110 750" stroke="#ED8B00"></path>
      <path d="M190 425L214 410M280 440L320 410L345 380L372 250" stroke="#003DA5"></path>
    </g>
    <g stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
      <path d="M105 260L160 350L182 405L200 450L228 470" stroke="#DA291C"></path>
      <path d="M214 410L200 450L178 468L150 478L120 488L85 498L48 508" stroke="#00843D"></path>
      <path d="M214 410L242 432L280 440" stroke="#003DA5"></path>
    </g>
    <g fill="#FFFFFF" stroke="#1D3557" stroke-width="2.5">
      <circle cx="105" cy="260" r="5"></circle><circle cx="160" cy="350" r="5"></circle><circle cx="182" cy="405" r="5"></circle><circle cx="228" cy="470" r="5"></circle>
      <circle cx="214" cy="410" r="5"></circle><circle cx="178" cy="468" r="5"></circle><circle cx="120" cy="488" r="5"></circle><circle cx="48" cy="508" r="5"></circle>
      <circle cx="242" cy="432" r="5"></circle><circle cx="280" cy="440" r="5"></circle>
      <circle cx="200" cy="450" r="7"></circle>
    </g>
    <g font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#1D3557">
      <text x="68" y="262">Harvard</text><text x="118" y="356">Kendall</text><text x="208" y="453">Park St</text>
      <text x="30" y="525">Kenmore</text><text x="100" y="476">Copley</text><text x="220" y="402">Gov Ctr</text><text x="282" y="456">Aquarium</text>
    </g>
  </svg>

  <div style="position: absolute; left: 14px; right: 14px; top: 16px; display: flex; gap: 10px; align-items: flex-start">
    <div style="flex-grow: 1; background: #FFFFFF; border: 3px solid #1D3557; border-radius: 18px; box-shadow: 4px 4px 0 #1D3557; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">Miles traveled</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: #C1272D">16</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <div style="background: #00843D; color: #FFFFFF; border: 2.5px solid #1D3557; border-radius: 12px; padding: 3px; display: flex; flex-direction: column; align-items: center"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1">10</span><span style="font-size: 10px; font-weight: 800">Green</span></div>
        <div style="background: #C1272D; color: #FFFFFF; border: 2.5px solid #1D3557; border-radius: 12px; padding: 3px; display: flex; flex-direction: column; align-items: center"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1">5</span><span style="font-size: 10px; font-weight: 800">Red</span></div>
        <div style="background: #003DA5; color: #FFFFFF; border: 2.5px solid #1D3557; border-radius: 12px; padding: 3px; display: flex; flex-direction: column; align-items: center"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1">1</span><span style="font-size: 10px; font-weight: 800">Blue</span></div>
        <div style="background: #FFFFFF; color: #1D3557; border: 2.5px dashed #ED8B00; border-radius: 12px; padding: 3px; display: flex; flex-direction: column; align-items: center"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1">0</span><span style="font-size: 10px; font-weight: 800">Orange</span></div>
      </div>
      <div style="display: flex; gap: 12px; font-size: 11px; font-weight: 700; flex-wrap: wrap">
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 18px; height: 5px; border-radius: 3px; background: #1D3557"></span>traveled</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 18px; border-top: 5px dotted #1D3557"></span>not yet</span>
        <span style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #FFC93C; border: 2px solid #1D3557"></span>unlocked spot</span>
      </div>
    </div>
    <a href="Faves.dc.html" aria-label="Your faved fun facts" style="width: 46px; height: 46px; flex-shrink: 0; border-radius: 50%; background: #FFFFFF; border: 3px solid #1D3557; box-shadow: 3px 3px 0 #1D3557; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFC93C" stroke="#1D3557" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"></path></svg>
    </a>
  </div>

  <sc-for list="{{spots}}" as="s" hint-placeholder-count="7">
    <button type="button" onClick="{{s.pick}}" aria-label="{{s.name}}" aria-pressed="{{s.sel}}" style="{{s.style}}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1D3557" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
    </button>
  </sc-for>

  <div style="position: absolute; left: 14px; right: 14px; bottom: 96px; background: #FFC93C; border: 3px solid #1D3557; border-radius: 16px; box-shadow: 4px 4px 0 #1D3557; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px">
    <span style="display: flex; flex-direction: column">
      <span style="font-weight: 800; font-size: 15px">{{spot.name}}</span>
      <span style="font-size: 12px; font-weight: 600">unlocked · {{spot.facts}} facts · near {{spot.stop}}</span>
    </span>
    <span style="font-family: Caveat, cursive; font-size: 20px; font-weight: 700; flex-shrink: 0">7 unlocked!</span>
  </div>

  <nav style="position: absolute; left: 14px; right: 14px; bottom: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px; border-radius: 18px; background: #FFFFFF; border: 3px solid #1D3557; text-decoration: none; color: #1D3557; font-size: 12px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E63946" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
      This page
    </a>
    <a href="Explore.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px; border-radius: 18px; background: #FFFFFF; border: 3px solid #1D3557; text-decoration: none; color: #1D3557; font-size: 12px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C98A00" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      Explore
    </a>
    <a href="Traveled.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px; border-radius: 18px; background: #00843D; border: 3px solid #1D3557; box-shadow: 3px 3px 0 #1D3557; text-decoration: none; color: #FFFFFF; font-size: 12px; font-weight: 800">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>
      Traveled
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'fenway' }; }
  renderVals() {
    var spots = [
      { id: 'harvard', name: 'Harvard Yard', x: 128, y: 236, facts: 3, stop: 'Harvard' },
      { id: 'fenway', name: 'Fenway Park', x: 34, y: 556, facts: 4, stop: 'Kenmore' },
      { id: 'bpl', name: 'Boston Public Library', x: 128, y: 512, facts: 2, stop: 'Copley' },
      { id: 'garden', name: 'Public Garden', x: 160, y: 444, facts: 2, stop: 'Arlington' },
      { id: 'statehouse', name: 'Massachusetts State House', x: 186, y: 426, facts: 2, stop: 'Park Street' },
      { id: 'faneuil', name: 'Faneuil Hall', x: 256, y: 404, facts: 3, stop: 'Government Center' },
      { id: 'aquarium', name: 'New England Aquarium', x: 296, y: 424, facts: 1, stop: 'Aquarium' }
    ];
    var self = this;
    return {
      spot: spots.filter(function (s) { return s.id === self.state.sel; })[0],
      spots: spots.map(function (s) {
        var sel = s.id === self.state.sel;
        var z = sel ? 38 : 30;
        return {
          name: s.name,
          sel: sel,
          pick: function () { self.setState({ sel: s.id }); },
          style: 'position:absolute;left:' + (s.x - z / 2) + 'px;top:' + (s.y - z / 2) + 'px;width:' + z + 'px;height:' + z + 'px;border-radius:50%;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#FFC93C;border:3px solid #1D3557;' + (sel ? 'box-shadow:3px 3px 0 #1D3557;z-index:2' : '')
        };
      })
    };
  }
}
</script>
</body>
</html>
