<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Fredoka:wght@600;700&amp;family=Inter:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D3557}a:hover{color:#457B9D}
.tq-nav a{transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.tq-nav a:hover{transform:translateY(-5px) rotate(-5deg)}
.tq-nav a:active{transform:scale(.86)}
@keyframes tq-wiggle{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.07)}}
@keyframes tq-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes tq-twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
.tq-on .tq-ic{animation:tq-wiggle 2.2s ease-in-out infinite}
.tq-off .tq-ic{animation:tq-bob 3s ease-in-out infinite}
.tq-spark{animation:tq-twinkle 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.tq-on .tq-ic,.tq-off .tq-ic,.tq-spark{animation:none}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'park', i: 0, faves: { park: true } }; }
  renderVals() {
    var places = [
      { id: 'statehouse', name: 'Massachusetts State House', x: 195, y: 62, c: '#FFC93C', facts: ['Its dome was first covered in copper by Paul Revere’s company in 1802.', 'The dome was covered in gold leaf in 1874.'] },
      { id: 'granary', name: 'Granary Burying Ground', x: 292, y: 82, c: '#F4A6C6', facts: ['Paul Revere, Samuel Adams and John Hancock are all buried here.', 'Founded in 1660, it is one of Boston’s oldest cemeteries.'] },
      { id: 'church', name: 'Park Street Church', x: 270, y: 112, c: '#A8DADC', facts: ['The song "America" (My Country, ’Tis of Thee) was first sung here on July 4, 1831.'] },
      { id: 'park', name: 'Park Street station', x: 250, y: 140, c: '#E63946', facts: ['You are in the oldest subway station in America. Park Street opened in 1897.', 'America’s first subway opened through here on September 1, 1897.'] },
      { id: 'frog', name: 'Frog Pond', x: 170, y: 150, c: '#A8DADC', facts: [], nearby: 'Colonists grazed their cows on Boston Common, all around you, until 1830.' },
      { id: 'common', name: 'Boston Common', x: 150, y: 228, c: '#B8E0A8', facts: ['Boston Common is the oldest public park in the US, set aside in 1634.'] },
      { id: 'garden', name: 'Public Garden', x: 45, y: 205, c: '#B8E0A8', facts: ['The Public Garden was the first public botanical garden in the US (1837).', 'Its Swan Boats have paddled the lagoon since 1877.'] }
    ];
    var self = this;
    var place = places.filter(function (p) { return p.id === self.state.sel; })[0];
    var n = place.facts.length;
    var i = Math.min(this.state.i, Math.max(n - 1, 0));
    var faved = !!this.state.faves[place.id];
    return {
      place: place,
      hasFacts: n > 0,
      noFacts: n === 0,
      fact: n ? place.facts[i] : '',
      tag: n ? 'did you know?!' : 'no history yet!',
      tagBg: n ? '#E63946' : '#457B9D',
      faved: faved,
      starFill: faved ? '#FFC93C' : 'none',
      toggleFave: function () {
        var f = Object.assign({}, self.state.faves);
        f[place.id] = !f[place.id];
        self.setState({ faves: f });
      },
      dots: n > 1 ? place.facts.map(function (t, k) {
        return {
          label: 'Fact ' + (k + 1) + ' of ' + n,
          style: 'display:block;width:12px;height:12px;border-radius:50%;border:2.5px solid #1D3557;box-sizing:border-box;' + (k === i ? 'background:#1D3557' : 'background:#FFFFFF'),
          pick: function () { self.setState({ i: k }); }
        };
      }) : [],
      pins: places.map(function (p) {
        var sel = p.id === self.state.sel;
        var s = sel ? 48 : 30;
        return {
          name: p.name,
          sel: sel,
          pick: function () { self.setState({ sel: p.id, i: 0 }); },
          style: 'position:absolute;left:' + (p.x - s / 2) + 'px;top:' + (p.y - s / 2) + 'px;width:' + s + 'px;height:' + s + 'px;border-radius:50%;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;border:3px solid #1D3557;background:' + (sel ? '#FFC93C' : p.c) + ';' + (sel ? 'box-shadow:3px 3px 0 #1D3557;z-index:2' : ''),
          dot: 'display:block;border-radius:50%;background:#1D3557;width:' + (sel ? 14 : 8) + 'px;height:' + (sel ? 14 : 8) + 'px'
        };
      })
    };
  }
}
</script>
